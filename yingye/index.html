<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>营业概况 · 营业收入趋势</title>
  <style>
    :root {
      --bg: #eef1f6;
      --card: #fff;
      --tile: #f7f8fa;
      --text: #323233;
      --sub: #646566;
      --muted: #969799;
      --line: #ebedf0;
      --blue: #1989fa;
      --red: #ee0a24;
      --green: #07c160;
      --today: #2f80ed;
      --yest: #5cbf6a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #d5d8de;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button, .hot { -webkit-tap-highlight-color: transparent; }

    .stage { min-height: 100%; display: flex; justify-content: center; }
    .app {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 18px 40px rgba(0,0,0,.12);
    }
    .scroll { flex: 1; overflow: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }

    .app.in-settings .statusbar { background: #fff; }
    .statusbar {
      height: 44px;
      padding: 10px 16px 0 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 650;
      flex: none;
    }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .header {
      height: 44px;
      padding: 0 12px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }
    .shop {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
    }
    .shop b {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 650;
    }
    .header-actions { display: flex; align-items: center; gap: 2px; }
    .icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
    .plus {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.6px solid #323233;
      display: inline-flex; align-items: center; justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 12px 14px;
      margin-bottom: 12px;
    }
    .update-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
    }
    .days { display: flex; align-items: center; gap: 14px; flex: none; }
    .days button { font-size: 14px; color: var(--text); line-height: 22px; }
    .days button.on { color: var(--blue); font-weight: 600; }

    .tabs {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      margin-top: 10px;
      border-bottom: 1px solid #f2f3f5;
    }
    .tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 8px 0 9px;
      color: var(--sub);
      font-size: 14px;
      white-space: nowrap;
    }
    .module-name {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 8px 0 9px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tablist { display: flex; align-items: flex-end; gap: 18px; }
    .tab.on { color: var(--blue); font-weight: 600; }
    .tab.on::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: var(--blue);
      border-radius: 1px;
    }

    .rev { padding: 12px 2px 0; }
    .m-title {
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--text);
      font-size: 14px;
      line-height: 20px;
    }
    .arr {
      width: 6px; height: 6px;
      border-top: 1.4px solid #c8c9cc;
      border-right: 1.4px solid #c8c9cc;
      transform: rotate(45deg);
      margin-left: 2px;
    }
    .rev-value {
      margin-top: 4px;
      font-size: 30px;
      line-height: 36px;
      font-weight: 700;
      letter-spacing: -.4px;
      font-variant-numeric: tabular-nums;
    }
    .meta { margin-top: 6px; }
    .meta.inline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 18px;
    }
    .m-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
    }
    .m-row .num { color: #646566; font-variant-numeric: tabular-nums; }
    .delta { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
    .delta.up { color: var(--red); }
    .delta.down { color: var(--green); }
    .delta.flat { color: var(--muted); }
    .delta i { width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; }
    .delta.up i { border-bottom: 5px solid var(--red); }
    .delta.down i { border-top: 5px solid var(--green); }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 10px 0 2px;
      color: var(--sub);
      font-size: 12px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-name { color: #323233; font-weight: 600; }
    .lg {
      width: 16px; height: 0;
      border-top: 2px solid var(--today);
    }
    .lg.dash { border-top: 2px dotted var(--yest); }
    .lg.mid { border-top: 2px dashed #ed6a0c; }

    .chart-box { position: relative; height: 176px; touch-action: pan-y; }
    .chart { width: 100%; height: 176px; display: block; }
    .guide {
      position: absolute;
      top: 8px;
      bottom: 22px;
      width: 1px;
      background: #d8d8d8;
      pointer-events: none;
    }
    .guide[hidden], .dot[hidden], .tip[hidden] { display: none; }
    .dot {
      position: absolute;
      width: 8px; height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--today);
      pointer-events: none;
    }
    .dot.yest { border-color: var(--yest); }
    .dot.mid { border-color: #ed6a0c; }
    .tip {
      position: absolute;
      z-index: 3;
      min-width: 168px;
      background: rgba(50,50,51,.94);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      pointer-events: none;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
    }
    .tip-time { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .tip-row { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; }
    .tip-row b { margin-left: auto; padding-left: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .sw { width: 12px; height: 2px; background: var(--today); border-radius: 1px; }
    .sw.dash { height: 0; border-top: 2px dotted var(--yest); background: none; }
    .sw.mid { height: 0; border-top: 2px dashed #ed6a0c; background: none; }
    .channels {
      display: flex;
      margin-top: 2px;
      overflow: auto;
      border-bottom: 1px solid #f2f3f5;
    }
    .channels button {
      flex: none;
      padding: 10px 12px 8px;
      color: #646566;
      font-size: 13px;
      line-height: 18px;
    }
    .channels button.on { color: #323233; font-weight: 600; box-shadow: inset 0 -2px 0 #1989fa; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .metric { background: var(--tile); border-radius: 8px; padding: 12px 12px 10px; min-width: 0; }
    .metric .m-title { font-size: 13px; color: #323233; }
    .m-value {
      margin-top: 6px;
      font-size: 22px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -.3px;
      font-variant-numeric: tabular-nums;
    }
    .metric .meta { margin-top: 8px; }
    .metric .m-row { font-size: 11px; line-height: 16px; justify-content: space-between; }
    .rev-card { position: relative; }
    .rev-card .m-title { padding-right: 22px; }
    .trend-btn {
      position: absolute;
      top: 8px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      color: #1989fa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .trend-btn.on { background: rgba(25, 137, 250, .12); }
    .trend-panel { grid-column: 1 / -1; }
    .more {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 20px;
    }
    .more .arr { transform: rotate(135deg); margin-top: -2px; }
    .more.on .arr { transform: rotate(-45deg); margin-top: 3px; }

    .rank-tabs { display: flex; gap: 16px; margin-top: 12px; border-bottom: 1px solid #f2f3f5; }
    .rank-list { padding-top: 4px; }
    .rank-item {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 11px 0;
    }
    .rank-item + .rank-item { border-top: 1px solid #f5f6f7; }
    .no { font-size: 14px; font-weight: 700; color: #c8c9cc; }
    .no.t1 { color: #ee0a24; }
    .no.t2 { color: #ed6a0c; }
    .no.t3 { color: #f0a020; }
    .rname { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rval { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .bar {
      grid-column: 2 / -1;
      height: 4px;
      margin-top: -6px;
      border-radius: 2px;
      background: #f2f3f5;
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; background: #8eb6f5; border-radius: 2px; }

    .tabbar {
      flex: none;
      height: 56px;
      background: #fff;
      border-top: 1px solid #f2f3f5;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      padding: 0 4px 6px;
      position: relative;
    }
    .nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #646566;
      font-size: 10px;
      line-height: 14px;
      padding-bottom: 2px;
    }
    .nav.on { color: #323233; font-weight: 650; }
    .ai {
      position: absolute;
      left: 50%;
      top: -16px;
      transform: translateX(-50%);
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: radial-gradient(circle at 35% 30%, #b9a6ff, #6d5efc 42%, #3d8bff 78%);
      box-shadow: 0 6px 16px rgba(80, 90, 220, .28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #home, .settings { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    [hidden] { display: none !important; }

    .set-nav {
      height: 44px;
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      padding: 0 8px;
      background: #fff;
      flex: none;
    }
    .set-nav h1 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
    .set-back { width: 36px; height: 36px; font-size: 28px; line-height: 1; color: #323233; }
    .set-save { justify-self: end; color: #1989fa; font-size: 16px; padding: 8px; }
    .set-tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #f2f3f5;
      flex: none;
    }
    .set-tab {
      position: relative;
      flex: 1;
      height: 44px;
      color: #646566;
      font-size: 15px;
    }
    .set-tab.on { color: #1989fa; font-weight: 600; }
    .set-tab.on::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 64px;
      height: 2px;
      margin-left: -32px;
      background: #1989fa;
      border-radius: 1px;
    }
    .set-scroll { flex: 1; overflow: auto; background: #f7f8fa; padding: 8px 12px 28px; -webkit-overflow-scrolling: touch; }
    .set-hint { margin: 4px 4px 10px; color: #969799; font-size: 12px; line-height: 18px; }
    .node { position: relative; }
    #setBody > .node + .node { margin-top: 12px; }
    .branch .node + .node { margin-top: 8px; }
    .mod-card {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 14px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(50, 50, 51, 0.04);
      user-select: none;
    }
    .mod-card.dim .mod-label,
    .nest-row.dim .mod-label { color: #c8c9cc; }
    .mod-card.nest-box { display: block; padding: 0 0 8px; }
    .nest-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 14px;
    }
    .nest-kids {
      position: relative;
      margin: 0 0 0 22px;
      padding-left: 14px;
    }
    .toggle { margin-left: auto; }
    .nest-kids::before {
      content: "";
      position: absolute;
      left: 0;
      top: -4px;
      width: 14px;
      height: 28px;
      border-left: 1px solid #dcdee0;
      border-bottom: 1px solid #dcdee0;
      border-bottom-left-radius: 8px;
    }
    .mod-label { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; text-align: left; }
    .grip {
      width: 14px;
      height: 18px;
      display: grid;
      grid-template-columns: repeat(2, 3px);
      grid-template-rows: repeat(3, 3px);
      gap: 3px;
      flex: none;
    }
    .grip i { width: 3px; height: 3px; border-radius: 50%; background: #c8c9cc; }
    .toggle {
      width: 46px;
      height: 28px;
      border-radius: 14px;
      background: #e5e5ea;
      position: relative;
      flex: none;
      transition: background .2s ease;
    }
    .toggle i {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
      transition: transform .2s ease;
    }
    .toggle.on { background: #1989fa; }
    .toggle.on i { transform: translateX(18px); }
    .branch { position: relative; margin-left: 18px; padding-left: 16px; }
    .branch > .node::before {
      content: "";
      position: absolute;
      left: -16px;
      top: -8px;
      width: 16px;
      height: 32px;
      border-left: 1px solid #dcdee0;
      border-bottom: 1px solid #dcdee0;
      border-bottom-left-radius: 8px;
    }
    .branch > .node:not(:last-child)::after {
      content: "";
      position: absolute;
      left: -16px;
      top: 24px;
      bottom: -8px;
      border-left: 1px solid #dcdee0;
    }
    .node.dragging > .mod-card { box-shadow: 0 10px 24px rgba(25, 137, 250, .18); }
    .group-title { margin: 14px 4px 8px; color: #969799; font-size: 13px; }
    .group-title:first-child { margin-top: 4px; }
    .metric-card + .metric-card { margin-top: 8px; }
    .coach { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; width: auto; background: none; pointer-events: auto; }
    .guide-mask {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, .55);
      -webkit-mask: radial-gradient(circle 22px at var(--gx, 320px) var(--gy, 66px), transparent 21px, #000 22.5px);
      mask: radial-gradient(circle 22px at var(--gx, 320px) var(--gy, 66px), transparent 21px, #000 22.5px);
    }
    .guide-arrow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .guide-copy {
      position: absolute;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #fff;
      z-index: 2;
    }
    .guide-copy h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 650; }
    .guide-copy p { margin: 8px 0 0; font-size: 16px; line-height: 24px; }
    .guide-ok {
      margin-top: 16px;
      min-width: 128px;
      height: 40px;
      padding: 0 18px;
      background: #fff;
      color: #323233;
      border-radius: 2px;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    }
    .toast {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .72);
      color: #fff;
      font-size: 14px;
      line-height: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      z-index: 30;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="app">
      <div class="statusbar">
        <span>19:52</span>
        <span class="status-right" aria-hidden="true">
          <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.6" fill="#323233"/><rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="#323233"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6" fill="#323233"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="#323233"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 9.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z" fill="#323233"/><path d="M4.2 7.4a4.7 4.7 0 0 1 6.6 0" stroke="#323233" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M1.8 5a8 8 0 0 1 11.4 0" stroke="#323233" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.6" y="0.6" width="20" height="10.8" rx="2" stroke="#323233" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#07c160"/><path d="M22 4v4a2 2 0 0 0 0-4Z" fill="#323233"/></svg>
        </span>
      </div>
      <div id="home">
      <div class="header">
        <button class="shop" type="button" aria-label="当前店铺">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5h12M3 9h12M3 13.5h8" stroke="#323233" stroke-width="1.4" stroke-linecap="round"/></svg>
          <b>yz测试-连锁fde专用</b>
        </button>
        <div class="header-actions">
          <button class="icon-btn" type="button" id="openSettings" aria-label="设置">
            <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="#323233" stroke-width="1.6" fill="none"/><path d="M19.4 13.2a7.6 7.6 0 0 0 .05-2.4l1.7-1.3-1.8-3.1-2 .6a7.4 7.4 0 0 0-1.7-1L15.2 3h-3.6l-.5 2.9a7.4 7.4 0 0 0-1.7 1l-2-.6L5.6 9.5l1.7 1.3a7.6 7.6 0 0 0 0 2.4l-1.7 1.3 1.8 3.1 2-.6a7.4 7.4 0 0 0 1.7 1l.5 2.9h3.6l.5-2.9a7.4 7.4 0 0 0 1.7-1l2 .6 1.8-3.1-1.8-1.3Z" stroke="#323233" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="新建">
            <span class="plus"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.5v9M1.5 6h9" stroke="#323233" stroke-width="1.4" stroke-linecap="round"/></svg></span>
          </button>
        </div>
      </div>

      <div class="scroll">
        <section class="card" id="overviewSection" aria-label="营业概况">
          <div class="update-row">
            <span id="updated"></span>
            <div class="days" role="tablist" aria-label="统计日">
              <button type="button" data-day="today" role="tab">今日</button>
              <button type="button" data-day="yesterday" role="tab">昨日</button>
            </div>
          </div>
          <div class="tabs">
            <span class="module-name">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 11.5h11" stroke="#ee0a24" stroke-width="1.2" stroke-linecap="round"/><path d="M2.2 9.2 5 6.2l2.1 1.8 4.2-4.6" stroke="#ee0a24" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              营业概况
            </span>
            <div class="tablist" role="tablist" aria-label="概况分类">

    function blankMetrics() {
      const result = {};

      });

    }
    let savedModules = clone(defaultModules);

    function findNode(id, nodes) {
      for (let i = 0; i < nodes.length; i += 1) {
        if (nodes[i].id === id) return nodes[i];
        if (nodes[i].children) {
          const found = findNode(id, nodes[i].children);
          if (found) return found;
        }
      }
      return null;
    }

    function isShown(id, list) {
      function walk(nodes, parentOn) {
        for (let i = 0; i < nodes.length; i += 1) {
          const node = nodes[i];
          const on = parentOn && node.on;
          if (node.id === id) return on;
          if (node.children) {
            const found = walk(node.children, on);
            if (found !== null) return found;
          }
        }
        return null;
      }
      return !!walk(list || savedModules, true);
    }

    function toggleButton(node) {
      return '<button type="button" class="toggle' + (node.on ? " on" : "") + '" data-toggle="' + node.id + '" role="switch" aria-checked="' + (node.on ? "true" : "false") + '" aria-label="' + node.name + '"><i></i></button>';
    }

    function moduleCard(node, depth, parentOn) {
      const grip = depth === 0
        ? '<span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>'
        : "";
      return '<div class="mod-card' + (parentOn ? "" : " dim") + '">' + grip +
        '<span class="mod-label">' + node.name + "</span>" + toggleButton(node) + "</div>";
    }

    function nestRow(node, parentOn) {
      return '<div class="nest-row' + (parentOn ? "" : " dim") + '"><span class="mod-label">' + node.name + "</span>" + toggleButton(node) + "</div>";
    }

    function moduleNodes(nodes, depth, parentOn) {
      return nodes.map((node) => {
        if (node.id === "performance" && node.children) {
          const kids = node.children.map((child) => nestRow(child, parentOn && node.on)).join("");
          return '<div class="node" data-mid="' + node.id + '" data-depth="' + depth + '">' +
            '<div class="mod-card nest-box' + (parentOn ? "" : " dim") + '">' +
            nestRow(node, parentOn) + '<div class="nest-kids">' + kids + "</div></div></div>";
        }
        const children = node.children ? '<div class="branch">' + moduleNodes(node.children, depth + 1, parentOn && node.on) + "</div>" : "";
        return '<div class="node" data-mid="' + node.id + '" data-depth="' + depth + '">' + moduleCard(node, depth, parentOn) + children + "</div>";
      }).join("");
    }

    const sum = (list) => list.reduce((total, value) => total + (value == null ? 0 : value), 0);
    const money = (value, digits) => Number(value).toLocaleString("en-US", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });

    function ratioOf(current, base) {
      if (current == null || base == null || base === 0) return { text: "—", cls: "flat", arrow: false };
      const percent = current / base * 100;
      if (Math.abs(percent - 100) < 0.005) return { text: "100.00%", cls: "flat", arrow: false };
      return percent > 100
        ? { text: percent.toFixed(2) + "%", cls: "up", arrow: true }
        : { text: percent.toFixed(2) + "%", cls: "down", arrow: true };
    }

    function growthOf(current, base) {
      if (current == null || base == null || base === 0) return { text: "—", cls: "flat", arrow: false };
      const percent = (current - base) / base * 100;
      if (Math.abs(percent) < 0.005) return { text: "0.00%", cls: "flat", arrow: false };
      return percent > 0
        ? { text: percent.toFixed(2) + "%", cls: "up", arrow: true }
        : { text: Math.abs(percent).toFixed(2) + "%", cls: "down", arrow: true };
    }

    function rateSpan(rate) {
      if (!rate.arrow) return '<span class="delta flat">' + rate.text + "</span>";
      return '<span class="delta ' + rate.cls + '"><i></i>' + rate.text + "</span>";
    }

    const lastWeekName = "上周" + ["日", "一", "二", "三", "四", "五", "六"][new Date(2026, 9, 18).getDay()];

    function dayMeta() {
      if (state.day === "today") {
        return {
          mode: "today",
          range: "更新于：10/19 00:00 - 10/19 19:52",
          currentKey: "today",
          baseLabel: "昨天全天",
          ratioLabel: "占比昨天"
        };
      }
      return {
        mode: "yesterday",
        range: "更新于：10/18 00:00 - 10/18 23:59",
        currentKey: "yesterday"
      };
    }

    function scaledHours(key, factor) {
      return revenueHours[key].map((value) => value == null ? null : Math.round(value * factor * 100) / 100);
    }

    function metaRows(current, base, digits, labels, inline) {
      const baseText = base == null ? "—" : money(base, digits);
      const ratio = ratioOf(current, base);
      const arrow = ratio.arrow ? "<i></i>" : "";
      return '<div class="meta' + (inline ? " inline" : "") + '">' +
        '<div class="m-row"><span>' + labels.baseLabel + '</span><span class="num">' + baseText + "</span></div>" +
        '<div class="m-row"><span>' + labels.ratioLabel + '</span><span class="delta ' + ratio.cls + '">' + ratio.text + arrow + "</span></div>" +
        "</div>";
    }

    function growthRows(current, dayBefore, lastWeek, inline) {
      return '<div class="meta' + (inline ? " inline" : "") + '">' +
        '<div class="m-row"><span>比前天</span>' + rateSpan(growthOf(current, dayBefore)) + "</div>" +
        '<div class="m-row"><span>比' + lastWeekName + "</span>" + rateSpan(growthOf(current, lastWeek)) + "</div>" +
        "</div>";
    }

    function scaleItem(item, scales) {
      if (!scales) return item;
      const next = Object.assign({}, item);
      ["today", "yesterday", "dayBefore", "lastWeek"].forEach((key) => {
        if (item[key] == null) return;
        const value = item[key] * scales[key];
        next[key] = item.digits === 0 ? Math.round(value) : Math.round(value * 100) / 100;
      });
      return next;
    }

    function metricCard(item, labels) {
      const current = item[labels.currentKey];
      const value = current == null ? "—" : money(current, item.digits);
      const meta = labels.mode === "today"
        ? metaRows(current, item.yesterday, item.digits, labels, false)
        : growthRows(current, item.dayBefore, item.lastWeek, false);
      return '<article class="metric"><div class="m-title">' + item.name + ' <i class="arr"></i></div>' +
        '<div class="m-value">' + value + "</div>" + meta + "</article>";
    }

    function smoothPath(points, top, bottom) {
      const groups = [];
      let current = [];
      points.forEach((point) => {
        if (!point) {
          if (current.length) groups.push(current);
          current = [];
        } else current.push(point);
      });
      if (current.length) groups.push(current);
      return groups.map((pts) => {
        let d = "M " + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2);
        for (let i = 0; i < pts.length - 1; i += 1) {
          const p0 = pts[Math.max(i - 1, 0)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(i + 2, pts.length - 1)];
          const c1x = p1.x + (p2.x - p0.x) / 6;
          const c1y = Math.min(bottom, Math.max(top, p1.y + (p2.y - p0.y) / 6));
          const c2x = p2.x - (p3.x - p1.x) / 6;
          const c2y = Math.min(bottom, Math.max(top, p2.y - (p3.y - p1.y) / 6));
          d += " C " + c1x.toFixed(2) + " " + c1y.toFixed(2) + ", " + c2x.toFixed(2) + " " + c2y.toFixed(2) + ", " + p2.x.toFixed(2) + " " + p2.y.toFixed(2);
        }
        return d;
      }).join(" ");
    }

    function chartSvg(seriesList) {
      const width = 340;
      const height = 176;
      const left = 42;
      const right = 8;
      const top = 10;
      const bottom = 24;
      const maxVal = Math.max.apply(null, seriesList.reduce((all, series) => all.concat(series.values.filter((value) => value != null)), [0]));
      const padded = Math.max(maxVal * 1.08, 1);
      const niceStep = (span, parts) => {
        const raw = span / parts;
        const mag = Math.pow(10, Math.floor(Math.log10(raw)));
        const options = [1, 2, 2.5, 5, 10].map((n) => n * mag);
        for (let i = 0; i < options.length; i += 1) {
          if (options[i] * parts >= span) return options[i];
        }
        return options[options.length - 1];
      };
      let parts = 4;
      let step = niceStep(padded, parts);
      if (step * parts / padded > 1.45) {
        parts = 5;
        step = niceStep(padded, parts);
      }
      const yMax = step * parts;
      const plotW = width - left - right;
      const plotH = height - top - bottom;
      const yOf = (value) => top + plotH - (value / yMax) * plotH;
      const xOf = (hour) => left + (plotW * hour) / 23;
      const toPoints = (values) => values.map((value, hour) => value == null ? null : { x: xOf(hour), y: yOf(value), value: value, hour: hour });
      const pointSets = seriesList.map((series) => toPoints(series.values));
      const ticks = [];
      for (let i = 0; i <= parts; i += 1) ticks.push(step * i);
      const yLabels = ticks.map((tick) => {
        const y = yOf(tick);
        const text = tick === 0 ? "0" : (tick >= 10000 ? (tick / 10000).toFixed(1) + "万" : tick.toLocaleString("en-US"));
        return '<text x="' + (left - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="10" fill="#c8c9cc">' + text + "</text>" +
          '<line x1="' + left + '" y1="' + y + '" x2="' + (width - right) + '" y2="' + y + '" stroke="#f0f1f3" stroke-width="1"/>';
      }).join("");
      const xLabels = [0, 6, 12, 18, 23].map((hour) => {
        const anchor = hour === 0 ? "start" : hour === 23 ? "end" : "middle";
        const label = String(hour).padStart(2, "0") + ":00";
        return '<text x="' + xOf(hour) + '" y="' + (height - 6) + '" text-anchor="' + anchor + '" font-size="10" fill="#c8c9cc">' + label + "</text>";
      }).join("");
      const paths = seriesList.map((series, index) => {
        const dash = series.dash ? ' stroke-dasharray="' + series.dash + '"' : "";
        return '<path d="' + smoothPath(pointSets[index], top, top + plotH) + '" fill="none" stroke="' + series.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + dash + "/>";
      }).reverse().join("");
      const hover = pointSets[0].map((point, hour) => ({
        hour: hour,
        x: xOf(hour),
        points: pointSets.map((set) => set[hour])
      }));
      return {
        html: '<svg class="chart" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="营业收入小时趋势">' + yLabels + xLabels + paths + "</svg>",
        meta: { w: width, h: height, hover: hover, slot: plotW / 23, series: seriesList }
      };
    }

    function couponScale() {
      const target = grids.meituan[0];

    function revenueBlock(scales, title, options) {

      const series = labels.mode === "today"
        ? [
            { name: "今日", values: scaledHours("today", scales.today), color: "#2f80ed", dash: "", sw: "" },
            { name: "昨天全天", values: scaledHours("yesterday", scales.yesterday), color: "#5cbf6a", dash: "0.8 5", sw: "dash" }
          ]
        : [
            { name: "昨日", values: scaledHours("yesterday", scales.yesterday), color: "#2f80ed", dash: "", sw: "" },
            { name: "前天", values: scaledHours("dayBefore", scales.dayBefore), color: "#ed6a0c", dash: "5 3", sw: "mid" },
            { name: lastWeekName, values: scaledHours("lastWeek", scales.lastWeek), color: "#5cbf6a", dash: "0.8 5", sw: "dash" }
          ];
      const current = sum(series[0].values);
      const compare = labels.mode === "today"
        ? metaRows(current, sum(series[1].values), 2, labels, false)
        : growthRows(current, sum(series[1].values), sum(series[2].values), false);
      const chart = chartSvg(series);
      const legend = '<b class="legend-name">' + title + "</b>" + series.map((item) => {
        const line = item.dash ? (item.sw === "dash" ? "dotted" : "dashed") : "solid";
        return '<span><i class="lg" style="border-top:2px ' + line + " " + item.color + '"></i>' + item.name + "</span>";
      }).join("");
      const dots = series.map((item, index) => '<div class="dot" data-i="' + index + '" hidden style="border-color:' + item.color + '"></div>').join("");
      const icon = showIcon
        ? '<button class="trend-btn' + (open ? " on" : "") + '" type="button" data-trend="toggle" aria-label="' + (open ? "关闭营业收入趋势" : "查看营业收入趋势") + '" aria-pressed="' + (open ? "true" : "false") + '"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.2 12.6 6.2 8.4 9 10.4 15.6 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.4 4.2h4.2V8.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        : "";
      const card = '<article class="metric rev-card"><div class="m-title">' + title + ' <i class="arr"></i></div>' + icon + '<div class="m-value">' + money(current, 2) + "</div>" + compare + "</article>";
      const chartHtml = '<section class="trend-panel" aria-label="营业收入趋势"><div class="legend">' + legend + '</div><div class="chart-box">' + chart.html + '<div class="guide" hidden></div>' + dots + '<div class="tip" hidden></div></div></section>';
      return { card: card, chartHtml: chartHtml, meta: chart.meta };
    }

    function renderPanel() {
      const labels = dayMeta();
      const visibleTabs = ["performance", "customer", "channel"].filter((id) => isShown(id));
      if (visibleTabs.length && visibleTabs.indexOf(state.tab) < 0) state.tab = visibleTabs[0];
      document.getElementById("overviewSection").hidden = !isShown("overview");
      document.getElementById("updated").textContent = labels.range;
      document.querySelectorAll("[data-day]").forEach((button) => {
        const on = button.dataset.day === state.day;
        button.classList.toggle("on", on);
        button.setAttribute("aria-selected", on ? "true" : "false");
      });
      document.querySelectorAll("[data-tab]").forEach((button) => {
        const on = button.dataset.tab === state.tab;
        button.hidden = !isShown(button.dataset.tab);
        button.classList.toggle("on", on);
        if (button.tagName === "BUTTON") button.setAttribute("aria-selected", on ? "true" : "false");
      });

      const meituan = state.tab === "channel" && state.channel === "meituan";
      const scales = state.tab === "channel" && !meituan ? channelScale[state.channel] : null;
      const source = meituan ? [] : (grids[state.tab] || []);
      const items = source.filter((item) => {
        if (!state.more && item.more) return false;
        const group = savedMetrics[state.tab];
        return !group || group[item.name] !== false;
      }).map((item) => scaleItem(item, scales));
      const cards = items.map((item) => metricCard(item, labels));
      const hiddenCount = source.filter((item) => item.more && (!savedMetrics[state.tab] || savedMetrics[state.tab][item.name] !== false)).length;
      const moreBtn = hiddenCount && (state.tab === "overview" || (state.tab === "channel" && !meituan))
        ? '<button class="more' + (state.more ? " on" : "") + '" type="button" data-more="1">' + (state.more ? "收起" : "更多数据") + ' <i class="arr"></i></button>'
        : "";
      const chips = state.tab === "channel"
        ? '<div class="channels" role="tablist" aria-label="渠道">' + channelNames.map((item) => '<button type="button" data-channel="' + item[0] + '" class="' + (state.channel === item[0] ? "on" : "") + '" role="tab" aria-selected="' + (state.channel === item[0] ? "true" : "false") + '">' + item[1] + "</button>").join("") + "</div>"
        : "";
      const hasRevenue = state.tab === "performance" || state.tab === "channel";
      let cells = cards.join("");
      let chartMeta = null;
      if (hasRevenue) {
        const open = !!state.trendOpen[state.tab];
        const block = revenueBlock(meituan ? couponScale() : (state.tab === "channel" ? channelScale[state.channel] : fullScale), meituan ? "平台券核销金额" : "营业收入", { showIcon: true, open: open });
        cells = block.card + (cards[0] || "") + (open ? block.chartHtml : "") + cards.slice(1).join("");
        chartMeta = open ? block.meta : null;
      }
      const gridHtml = cells ? '<div class="metrics">' + cells + "</div>" : "";
      document.getElementById("panel").innerHTML = chips + gridHtml + moreBtn;
      const chart = document.querySelector(".chart");
      if (chart && chartMeta) chart._meta = chartMeta;
    }

    function renderRank() {
      const labels = dayMeta();
      const rankMap = [["biz", "rankChannel"], ["shop", "rankShop"], ["goods", "rankGoods"]];
      const visibleRanks = rankMap.filter((item) => isShown(item[1])).map((item) => item[0]);
      document.getElementById("rankSection").hidden = !isShown("rank") || !visibleRanks.length;
      if (visibleRanks.length && visibleRanks.indexOf(state.rank) < 0) state.rank = visibleRanks[0];
      document.getElementById("rankUpdated").textContent = labels.range;
      document.querySelectorAll("[data-rank]").forEach((button) => {
        const on = button.dataset.rank === state.rank;
        const id = { biz: "rankChannel", shop: "rankShop", goods: "rankGoods" }[button.dataset.rank];
        button.hidden = !isShown(id);
        button.classList.toggle("on", on);
        button.setAttribute("aria-selected", on ? "true" : "false");
      });
      if (!visibleRanks.length) {
        document.getElementById("rankList").innerHTML = "";
        return;
      }
      const rows = ranks[state.rank];
      const max = Math.max.apply(null, rows.map((row) => row[1]));
      const digits = state.rank === "goods" ? 0 : 2;
      document.getElementById("rankList").innerHTML = rows.map((row, index) => {
        const hot = index < 3 ? " t" + (index + 1) : "";
        return '<div class="rank-item"><span class="no' + hot + '">' + (index + 1) + '</span><span class="rname">' + row[0] + '</span><span class="rval">' + money(row[1], digits) + '</span></div>' +
          '<div class="bar"><i style="width:' + (row[1] / max * 100).toFixed(1) + '%"></i></div>';
      }).join("");
    }

    function hideTip() {
      const box = document.querySelector(".chart-box");
      if (!box) return;
      box.querySelectorAll(".guide, .dot, .tip").forEach((node) => { node.hidden = true; });
    }

    function onChartMove(event) {
      const box = event.target.closest ? event.target.closest(".chart-box") : null;
      if (!box) { hideTip(); return; }
      const svg = box.querySelector(".chart");
      const meta = svg && svg._meta;
      if (!meta) return;
      const rect = svg.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * meta.w;
      let best = null;
      let bestDistance = 1e9;
      meta.hover.forEach((point) => {
        const distance = Math.abs(point.x - x);
        if (distance < bestDistance) { bestDistance = distance; best = point; }
      });
      if (!best || bestDistance > meta.slot * 0.75) { hideTip(); return; }
      const xPx = best.x / meta.w * rect.width;
      const guide = box.querySelector(".guide");
      guide.hidden = false;
      guide.style.left = xPx + "px";
      box.querySelectorAll(".dot").forEach((dot) => {
        const point = best.points[Number(dot.dataset.i)];
        if (!point) { dot.hidden = true; return; }
        dot.hidden = false;
        dot.style.left = xPx + "px";
        dot.style.top = (point.y / meta.h * rect.height) + "px";
      });
      const tip = box.querySelector(".tip");
      const hour = String(best.hour).padStart(2, "0") + ":00";
      let rows = '<div class="tip-time">' + hour + "</div>";
      meta.series.forEach((series, index) => {
        const point = best.points[index];
        if (!point) return;
        rows += '<div class="tip-row"><i class="sw ' + series.sw + '"></i><span>' + series.name + "</span><b>" + money(point.value, 2) + "</b></div>";
      });
      tip.innerHTML = rows;
      tip.hidden = false;
      const tipWidth = 180;
      let left = xPx + 12;
      if (left + tipWidth > rect.width) left = xPx - tipWidth - 8;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = "6px";
    }

    function renderSettings() {
      document.querySelectorAll("[data-settab]").forEach((button) => {
        const on = button.dataset.settab === state.setTab;
        button.classList.toggle("on", on);
        button.setAttribute("aria-selected", on ? "true" : "false");
      });
      const hint = document.getElementById("setHint");
      if (state.setTab === "module") {
        hint.textContent = "长按模块卡可调整顺序，修改后点击右上角保存";
        document.getElementById("setBody").innerHTML = moduleNodes(draftModules, 0, true);
        if (dragId) {
          const current = document.querySelector('#setBody > .node[data-mid="' + dragId + '"]');
          if (current) current.classList.add("dragging");
        }
        return;
      }
      hint.textContent = "关闭后，对应指标不再展示在首页模块中";
      const titles = { performance: "业绩概况", customer: "客户概况", channel: "渠道概况" };
      document.getElementById("setBody").innerHTML = Object.keys(metricNames).map((key) => {
        const cards = metricNames[key].map((name) => {
          const on = draftMetrics[key][name] !== false;
          return '<div class="mod-card metric-card"><span class="mod-label">' + name + "</span>" +
            '<button type="button" class="toggle' + (on ? " on" : "") + '" data-metric="' + key + '" data-name="' + name + '" role="switch" aria-checked="' + (on ? "true" : "false") + '" aria-label="' + name + '"><i></i></button></div>';
        }).join("");
        return '<div class="group-title">' + titles[key] + "</div>" + cards;
      }).join("");
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.hidden = true; }, 1600);
    }

    function hideGuide() {
      const guide = document.getElementById("guide");
      if (guide) guide.hidden = true;
    }

    function placeGuide() {
      const guide = document.getElementById("guide");
      const btn = document.getElementById("openSettings");
      if (!guide || guide.hidden || !btn) return;
      const app = document.querySelector(".app");
      const appRect = app.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const cx = btnRect.left - appRect.left + btnRect.width / 2;
      const cy = btnRect.top - appRect.top + btnRect.height / 2;
      guide.querySelector(".guide-mask").style.setProperty("--gx", cx + "px");
      guide.querySelector(".guide-mask").style.setProperty("--gy", cy + "px");
      const copy = document.getElementById("guideCopy");
      const copyTop = Math.max(cy + 118, 168);
      copy.style.top = copyTop + "px";
      const width = appRect.width;
      const height = appRect.height;
      const x1 = cx;
      const yTip = cy + 24;
      const x2 = width / 2 + 18;
      const y2 = copyTop - 2;
      const svg = document.getElementById("guideArrow");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.innerHTML = '<path d="M ' + x2.toFixed(1) + " " + y2.toFixed(1) +
        " C " + (x2 + 36).toFixed(1) + " " + (y2 - 28).toFixed(1) +
        ", " + (x1 + 10).toFixed(1) + " " + (yTip + 46).toFixed(1) +
        ", " + x1.toFixed(1) + " " + (yTip + 12).toFixed(1) +
        '" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/>' +
        '<polygon points="' + (x1 - 6.5).toFixed(1) + "," + (yTip + 9).toFixed(1) + " " +
        (x1 + 6.5).toFixed(1) + "," + (yTip + 9).toFixed(1) + " " +
        x1.toFixed(1) + "," + yTip.toFixed(1) + '" fill="#fff"/>';
    }

    function openSettings() {
      hideGuide();
      draftModules = clone(savedModules);
      draftMetrics = clone(savedMetrics);
      state.setTab = "module";
      dragId = "";
      document.getElementById("home").hidden = true;
      document.getElementById("settings").hidden = false;
      document.querySelector(".app").classList.add("in-settings");
      renderSettings();
    }

    function closeSettings() {
      document.getElementById("settings").hidden = true;
      document.getElementById("home").hidden = false;
      document.querySelector(".app").classList.remove("in-settings");
      dragId = "";
    }

    function renderHome() {
      const scroll = document.querySelector("#home .scroll");
      savedModules.forEach((node) => {
        const section = node.id === "overview" ? document.getElementById("overviewSection") : node.id === "rank" ? document.getElementById("rankSection") : null;
        if (section) scroll.appendChild(section);
      });
      renderPanel();
      renderRank();
    }

    document.getElementById("openSettings").addEventListener("click", openSettings);
    document.getElementById("setBack").addEventListener("click", closeSettings);
    document.getElementById("setSave").addEventListener("click", () => {
      savedModules = clone(draftModules);
      savedMetrics = clone(draftMetrics);
      closeSettings();
      renderHome();
      showToast("已保存");
    });
    document.querySelector(".set-tabs").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-settab]");
      if (!tab) return;
      state.setTab = tab.dataset.settab;
      renderSettings();
    });
    document.getElementById("setBody").addEventListener("click", (event) => {
      const toggle = event.target.closest("[data-toggle]");
      const metric = event.target.closest("[data-metric]");
      if (toggle) {
        const node = findNode(toggle.dataset.toggle, draftModules);
        if (!node) return;
        node.on = !node.on;
        renderSettings();
        return;
      }
      if (metric) {
        draftMetrics[metric.dataset.metric][metric.dataset.name] = draftMetrics[metric.dataset.metric][metric.dataset.name] === false;
        renderSettings();
      }
    });

    const setBody = document.getElementById("setBody");
    let press = null;
    let dragId = "";
    setBody.addEventListener("pointerdown", (event) => {
      if (state.setTab !== "module" || event.target.closest(".toggle")) return;
      const card = event.target.closest(".mod-card");
      if (!card || card.parentElement.parentElement !== setBody) return;
      const node = card.parentElement;
      press = {
        id: node.dataset.mid,
        x: event.clientX,
        y: event.clientY,
        pointerId: event.pointerId,
        timer: setTimeout(() => {
          dragId = node.dataset.mid;
          node.classList.add("dragging");
          if (setBody.setPointerCapture) setBody.setPointerCapture(event.pointerId);
        }, 280)
      };
    });
    setBody.addEventListener("pointermove", (event) => {
      if (!press || press.pointerId !== event.pointerId) return;
      if (!dragId) {
        if (Math.abs(event.clientX - press.x) + Math.abs(event.clientY - press.y) > 8) {
          clearTimeout(press.timer);
          press = null;
        }
        return;
      }
      const siblings = Array.prototype.slice.call(setBody.querySelectorAll(":scope > .node"));
      const target = siblings.find((el) => {
        if (el.dataset.mid === dragId) return false;
        const rect = el.getBoundingClientRect();
        return event.clientY > rect.top && event.clientY < rect.bottom;
      });
      if (!target) return;
      const from = draftModules.findIndex((item) => item.id === dragId);
      const to = draftModules.findIndex((item) => item.id === target.dataset.mid);
      if (from < 0 || to < 0 || from === to) return;
      const moved = draftModules.splice(from, 1)[0];
      draftModules.splice(to, 0, moved);
      const scroll = document.querySelector(".set-scroll");
      const top = scroll.scrollTop;
      renderSettings();
      scroll.scrollTop = top;
    });
    function endDrag(event) {
      if (!press || (event && press.pointerId !== event.pointerId)) return;
      clearTimeout(press.timer);
      press = null;
      dragId = "";
      document.querySelectorAll(".node.dragging").forEach((el) => el.classList.remove("dragging"));
    }
    setBody.addEventListener("pointerup", endDrag);
    setBody.addEventListener("pointercancel", endDrag);

    document.body.addEventListener("click", (event) => {
      if (event.target.closest("#settings")) return;
      const trend = event.target.closest("[data-trend]");
      const day = event.target.closest("[data-day]");
      const tab = event.target.closest("[data-tab]");
      const rank = event.target.closest("[data-rank]");
      const more = event.target.closest("[data-more]");
      const channel = event.target.closest("[data-channel]");
      if (trend) { state.trendOpen[state.tab] = !state.trendOpen[state.tab]; renderPanel(); }
      else if (day) { state.day = day.dataset.day; renderPanel(); renderRank(); }
      else if (tab && tab.dataset.tab !== "overview") { state.tab = tab.dataset.tab; state.more = false; renderPanel(); }
      else if (channel) { state.channel = channel.dataset.channel; renderPanel(); }
      else if (rank) { state.rank = rank.dataset.rank; renderRank(); }
      else if (more) { state.more = !state.more; renderPanel(); }
    });
    document.getElementById("panel").addEventListener("pointermove", onChartMove);
    document.getElementById("panel").addEventListener("pointerleave", hideTip);

    document.getElementById("guideOk").addEventListener("click", hideGuide);
    window.addEventListener("resize", placeGuide);
    renderHome();
    placeGuide();
  </script>
</body>
</html>
